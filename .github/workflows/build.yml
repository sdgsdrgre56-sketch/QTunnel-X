name: Build Quasar APK
on:
  workflow_dispatch:
  push:
    branches: [main, quasar-android]
jobs:
  apk:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      # 1) Туннель TUN → SOCKS5 (hev-socks5-tunnel)
      - name: Build hev-socks5-tunnel
        run: |
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel app/src/main/jni/hev-socks5-tunnel
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME}}"
          echo "NDK=$NDK"
          "$NDK/ndk-build" NDK_PROJECT_PATH=app/src/main APP_BUILD_SCRIPT=app/src/main/jni/Android.mk NDK_APPLICATION_MK=app/src/main/jni/Application.mk NDK_LIBS_OUT=app/src/main/jniLibs
          ls -la app/src/main/jniLibs/arm64-v8a

      # 2) Node.js для Android (nodejs-mobile): на нём работает сам Квазар
      - name: Fetch nodejs-mobile
        run: |
          gh release list --repo nodejs-mobile/nodejs-mobile --limit 5
          gh release download --repo nodejs-mobile/nodejs-mobile --pattern 'nodejs-mobile-v*-android.zip' --dir .
          mkdir nm && unzip -q nodejs-mobile-v*-android.zip -d nm
          find nm -maxdepth 3 | head -30
          mkdir -p app/libnode/bin
          cp -r nm/bin/arm64-v8a app/libnode/bin/arm64-v8a
          cp -r nm/include app/libnode/include
          ls app/libnode/include/node | head -3

      # 3) Код Квазара (как на ПК) + ssh2 внутрь APK
      - name: Pack Quasar into assets
        run: |
          mkdir -p app/src/main/assets
          cp -r nodejs-project app/src/main/assets/nodejs-project
          cd app/src/main/assets/nodejs-project
          npm install --omit=dev --no-audit --no-fund
          find . -name '*.node' -delete
          du -sh .

      # 4) Ядра протоколов
      - name: Fetch cores
        run: ./tools/fetch-cores.sh

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: quasar-mobile-apk, path: app/build/outputs/apk/debug/app-debug.apk }
