name: Build Quasar APK
on:
  workflow_dispatch:
  push:
    branches: [main, quasar-android]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      # 1) Туннель TUN → SOCKS5 (hev-socks5-tunnel), нативная библиотека
      - name: Build hev-socks5-tunnel
        run: |
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel app/src/main/jni/hev-socks5-tunnel
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME}}"
          echo "NDK=$NDK"
          "$NDK/ndk-build" NDK_PROJECT_PATH=app/src/main APP_BUILD_SCRIPT=app/src/main/jni/Android.mk NDK_APPLICATION_MK=app/src/main/jni/Application.mk NDK_LIBS_OUT=app/src/main/jniLibs
          ls -la app/src/main/jniLibs/arm64-v8a

      # 2) Ядро mihomo (там живёт Sudoku), официальный релиз под Android arm64
      - name: Download mihomo core
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api repos/MetaCubeX/mihomo/releases/latest --jq '.assets[].name' | tee assets.txt
          NAME=$(grep -E '^mihomo-android-arm64(-v8)?-v[0-9.]+\.gz$' assets.txt | head -1)
          [ -n "$NAME" ] || NAME=$(grep -E '^mihomo-android-arm64.*\.gz$' assets.txt | grep -vE 'cgo|alpha' | head -1)
          echo "mihomo asset: $NAME"
          gh release download --repo MetaCubeX/mihomo --pattern "$NAME" --dir .
          gunzip -c "$NAME" > app/src/main/jniLibs/arm64-v8a/libmihomo.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libmihomo.so

      # 3) Ядро sing-box (VLESS Reality, Hysteria2, TUIC, AnyTLS, Trojan, Shadowsocks, ShadowTLS, HTTP, SOCKS5). Берём ветку 1.11 — под неё написан конфиг.
      - name: Download sing-box core
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG=$(gh release list --repo SagerNet/sing-box --limit 60 --json tagName,isPrerelease --jq '[.[]|select(.isPrerelease==false)|.tagName|select(test("^v1\\.11\\.[0-9]+$"))][0]')
          echo "sing-box tag: $TAG"
          gh release view "$TAG" --repo SagerNet/sing-box --json assets --jq '.assets[].name' | grep android | tee sb-assets.txt
          NAME=$(grep -E 'android-arm64\.tar\.gz$' sb-assets.txt | head -1)
          echo "sing-box asset: $NAME"
          gh release download "$TAG" --repo SagerNet/sing-box --pattern "$NAME" --dir .
          mkdir sbx && tar -xzf "$NAME" -C sbx
          cp "$(find sbx -type f -name sing-box | head -1)" app/src/main/jniLibs/arm64-v8a/libsingbox.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libsingbox.so

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: quasar-mobile-apk, path: app/build/outputs/apk/debug/app-debug.apk }
