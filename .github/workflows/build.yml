name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LockVideo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LockVideo.apk
          gh release delete lockvideo-latest --yes --cleanup-tag || true
          gh release create lockvideo-latest LockVideo.apk --target ${{ github.sha }} --title "LockVideo APK" --notes "Video with sound on screen wake"
