name: Build QTunnel X

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QTunnel-X-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Test server
        working-directory: server
        run: go test ./...

      - name: Build x86-64
        working-directory: server
        run: GOOS=linux GOARCH=amd64 go build -o qtunnelx-server-amd64 ./cmd/qtunnelx-server

      - name: Build ARM64
        working-directory: server
        run: GOOS=linux GOARCH=arm64 go build -o qtunnelx-server-arm64 ./cmd/qtunnelx-server

      - name: Upload server
        uses: actions/upload-artifact@v4
        with:
          name: QTunnel-X-Server
          path: |
            server/qtunnelx-server-amd64
            server/qtunnelx-server-arm64
